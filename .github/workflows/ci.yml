name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One encoding for every platform. The Windows runner otherwise starts Python
# child processes on a legacy code page, so UTF-8 output (the kit's diagnostics
# are UTF-8, and several of them are non-ASCII) fails to encode on the way out
# and to decode on the way back in, even though the same command passes on
# Linux. This is a runner setting only: no product behaviour depends on it.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  checks:
    name: checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps: &checks-steps
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # All Python invocations go through uv (project convention); setup-python
      # only pins the interpreters that uv then picks up from PATH.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate kit structure
        run: uv run python scripts/validate_kit.py

      # This repository ships the checker but no Architecture Contract, so the
      # run is a read-only regression: it must exit 0 in diagnostic mode and
      # must not invent module boundaries. A project that adds a contract runs
      # the same command and gets a non-zero exit only under ENFORCE.
      - name: Architecture contract check (diagnostic)
        run: uv run python scripts/architecture/check.py --project . --json

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      # Synthetic delivery scenarios: every scenario must PASS (a negative
      # scenario passing means its gate really fired), the report must carry no
      # ERROR, and the exit code must be 0. No `continue-on-error`: a broken gate
      # has to turn this job red. The report is written to the runner temp
      # directory, never into the repository. `runner.temp` is used instead of
      # the platform-specific $RUNNER_TEMP shell variable so the same step works
      # under bash and under the Windows runner's pwsh.
      - name: Synthetic delivery scenarios
        run: >-
          uv run python scripts/run_delivery_scenarios.py --json
          --output "${{ runner.temp }}/delivery-scenarios.json"

      # Metric report self-check: the fixed gold sample must reproduce a report
      # with seven metrics and an explicit window. The report is read-only and
      # never touches a task library or a credential.
      - name: Delivery metrics (gold sample)
        run: >-
          uv run python scripts/report_metrics.py --gold-sample
          --since 2026-01-01 --until 2026-02-01 --json

      # Cross-platform syntax check. The explicit list pins the core scripts; the
      # two wildcard directories are expanded in Python because the Windows
      # runner's default pwsh does not expand `scripts/*/*.py` the way bash does,
      # and a silently unexpanded glob would leave those modules unchecked.
      - name: Syntax check
        run: >-
          uv run python -c "import glob, py_compile, sys; files = list(sys.argv[1:]) + sorted(glob.glob('scripts/update_agentorch/*.py')) + sorted(glob.glob('scripts/self_improvement/*.py')); [py_compile.compile(f, doraise=True) for f in files]; print('syntax ok: %d files' % len(files))"
          scripts/orchestrator.py scripts/validate_kit.py scripts/check_drift.py
          scripts/architecture/check.py scripts/architecture/contract.py
          scripts/architecture/report.py scripts/architecture/rules.py
          scripts/architecture/adapters/python_ast.py scripts/architecture/adapters/rust.py

      # Release packaging self-check. No `continue-on-error`, no `|| true`: a
      # packaging regression (missing file, broken link inside the package,
      # manifest mismatch, forbidden path) must turn this job red, exactly as it
      # would at release time. The zip is written to the runner's `release/`
      # directory, which `.gitignore` already excludes; it is never committed or
      # uploaded. Runs on every matrix entry of every OS on purpose: the
      # self-check executes the shipped test suite inside the extracted archive,
      # so each supported platform/version proves the artifact it would receive.
      - name: Release self-check (build_release.py)
        run: uv run python scripts/build_release.py

  # Real macOS runner. Same steps as `checks`, single Python version: this job
  # exists to prove the kit on the platform, not to widen the version promise.
  checks-macos:
    name: checks-macos (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps: *checks-steps

  # Real Windows runner (default shell is pwsh). Same steps as `checks`; the
  # steps above are written to work under both bash and pwsh, and the packaging
  # self-check keeps proving that a Windows checkout cannot smuggle CRLF into the
  # archive.
  checks-windows:
    name: checks-windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps: *checks-steps
