name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # All Python invocations go through uv (project convention); setup-python
      # only pins the interpreters that uv then picks up from PATH.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate kit structure
        run: uv run python scripts/validate_kit.py

      # This repository ships the checker but no Architecture Contract, so the
      # run is a read-only regression: it must exit 0 in diagnostic mode and
      # must not invent module boundaries. A project that adds a contract runs
      # the same command and gets a non-zero exit only under ENFORCE.
      - name: Architecture contract check (diagnostic)
        run: uv run python scripts/architecture/check.py --project . --json

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Syntax check
        run: >-
          uv run python -m py_compile
          scripts/orchestrator.py scripts/validate_kit.py scripts/check_drift.py
          scripts/architecture/check.py scripts/architecture/contract.py
          scripts/architecture/report.py scripts/architecture/rules.py
          scripts/architecture/adapters/python_ast.py scripts/architecture/adapters/rust.py

      # Release packaging self-check. No `continue-on-error`, no `|| true`: a
      # packaging regression (missing file, broken link inside the package,
      # manifest mismatch, forbidden path) must turn this job red, exactly as it
      # would at release time. The zip is written to the runner's `release/`
      # directory, which `.gitignore` already excludes; it is never committed or
      # uploaded. Runs on every matrix entry (3.12 and 3.13) on purpose: the
      # self-check executes the shipped test suite inside the extracted archive,
      # so each supported version proves the artifact it would receive.
      - name: Release self-check (build_release.py)
        run: uv run python scripts/build_release.py
