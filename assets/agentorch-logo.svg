      <stop offset="1" stop-color="#6258E8"/>
    </linearGradient>
    <linearGradient id="orbit-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6659E8"/>
    </linearGradient>
    <linearGradient id="word-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3478F6"/>
      <stop offset="1" stop-color="#6558E8"/>
