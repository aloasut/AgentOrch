  <text x="176" y="83" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="61" font-weight="760" letter-spacing="-2.2" fill="#13233F">Agent<tspan fill="url(#word-gradient)">Orch</tspan></text>
  <text x="181" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.05" fill="#526680">GOVERNED WORKFLOWS FOR AI AGENTS</text>
